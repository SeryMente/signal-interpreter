<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Interpreter · CLIENTE</title><link rel="icon" type="image/png" sizes="16x16" href="../icons/icon16.png"><link rel="stylesheet" href="sidepanel.css"></head>
