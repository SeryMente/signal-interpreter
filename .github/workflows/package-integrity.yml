name: Package integrity
on:
  push:
    branches:
      - fix/global-overlay-toggle-installer-20261028
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify package inventory and overlay invariants
        run: node tools/verify-release-package.mjs
