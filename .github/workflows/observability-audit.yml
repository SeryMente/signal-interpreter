name: signal-observability-audit
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax
        run: |
          node --check extension/caption-lab.js
          node --check extension/ui/lab.js
          node --check extension/background.js
          node --check extension/auth-bootstrap.js
          node --check extension/auth-signin-assist.js
          node --check tools/cloud-login-bootstrap-test.mjs
          node --check extension/content.js
          node --check extension/mic-guard-main.js
          node --check extension/global-mouse-gesture.js
          node --check extension/hotkey-fallback.js
          node --check tools/global-microphone-hotkey-test.mjs
          node --check tools/microphone-feedback-test.mjs
          node --check extension/platform-screenshot.js
          node --check tools/observability-relay/api/screenshot.js
          node --check extension/offscreen.js
          node --check tools/hotload-active-call-test.mjs
          node --check extension/groq-transcriber.js
          node --check tools/groq-transcriber-tests.mjs
          node --check tools/evaluate-dialogue-quality.mjs
          node --check tools/dialogue-quality-evaluation-tests.mjs
          node --check tools/live-caption-core-test.mjs
          node --check tools/live-caption-bridge-tests.mjs
          node --check tools/live-caption-offscreen-tests.mjs
          node --check tools/live-caption-static-audit.mjs
          node --check tools/earnings-overlay-tests.mjs
          node --check tools/official-sync-scheduled-no-tab-test.mjs
          node --check tools/installer-inventory-shape-test.mjs
          node --check tools/pipeline-hotkey-consistency-test.mjs
          node --check tools/overlay-global-toggle-regression-test.mjs
          node --check tools/call-earnings-baseline-tests.mjs
          node --check extension/live-caption-core.js
          node --check extension/live-caption-bridge.js
          node --check extension/live-caption-overlay.js
          node --check extension/youtube-caption-adapter.js
          node --check extension/ui/popup.js
          node --check extension/observability-relay.js
          node --check tools/observability-relay/api/batch.js
          node --check extension/observation-sync.js
          node --check tools/observability/incoming-call-window.mjs
          node --check tools/observability/incoming-call-window-test.mjs
          node --check tools/observability-freshness-audit.mjs
          node --check tools/observability-freshness-audit-test.mjs
          node --check tools/observability-relay-batch-test.mjs
          node --check tools/observability-call-lifecycle-sync-test.mjs
          node --check tools/observability/platform-learning.mjs
          node --check tools/observability/platform-learning-test.mjs
          node --check tools/observability-github-pipeline.mjs
          node --check tools/observability-github-pipeline-test.mjs
          node --check tools/observability-package-audit.mjs
          node --check tools/observability-package-audit-test.mjs
          node --check tools/observability-cycle-delta.mjs
          node --check tools/observability-cycle-delta-test.mjs
          node --check tools/call-observability-report-test.mjs
          node --check tools/overlay-activation-regression-test.mjs
          node --check extension/presence-guard.js
          node --check tools/presence-guard-test.mjs
          node --check tools/presence-connect-test.mjs
          node --check tools/autoanswer-runtime-guard-test.mjs

  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run guards
        run: |
          node tools/presence-guard-test.mjs
          node tools/presence-connect-test.mjs
          node tools/autoanswer-runtime-guard-test.mjs
          node tools/caption-language-spans-test.mjs
          node tools/cloud-login-bootstrap-test.mjs
          node tools/hotload-caption-runtime-test.mjs
          node tools/hotload-active-call-test.mjs
          node tools/microphone-guard-test.mjs
          node tools/global-mouse-gesture-test.mjs
          node tools/global-microphone-hotkey-test.mjs
          node tools/microphone-feedback-test.mjs
          node tools/platform-screenshot-test.mjs
          node tools/official-sync-scheduled-no-tab-test.mjs
          node tools/installer-inventory-shape-test.mjs
          node tools/pipeline-hotkey-consistency-test.mjs
          node tools/overlay-global-toggle-regression-test.mjs

  observability:
    name: observability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run observability
        run: |
          node tools/observability/platform-learning-test.mjs
          node tools/observability-screenshot-relay-test.mjs
          node tools/observability-github-pipeline-test.mjs
          node tools/observability/incoming-call-window-test.mjs
          node tools/observability-relay-batch-test.mjs
          node tools/observability-call-lifecycle-sync-test.mjs
          node tools/observability-freshness-audit-test.mjs
          node tools/call-observability-report-test.mjs
          node tools/overlay-activation-regression-test.mjs
          node tools/observability-package-audit-test.mjs
          node tools/observability-package-audit.mjs observations
          node tools/observability-cycle-delta-test.mjs
          node tools/call-earnings-baseline-tests.mjs
          node tools/earnings-overlay-tests.mjs

  captions:
    name: captions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run captions
        run: |
          node tools/groq-transcriber-tests.mjs
          node tools/dialogue-quality-evaluation-tests.mjs
          node tools/call-caption-runtime-test.mjs
          node tools/call-export-runtime-test.mjs
          node tools/live-caption-core-test.mjs
          node tools/live-caption-bridge-tests.mjs
          node tools/live-caption-offscreen-tests.mjs
          node tools/signal-interpreter-longitudinal-regression-test.mjs
          node tools/live-reader-native-caption-regression-test.mjs
          node tools/live-caption-static-audit.mjs
          node tools/observability-static-audit.mjs
          node tools/portable-root-test.mjs
          node tools/caption-lab-test.mjs
          node tools/bundled-lab-sample-test.mjs

  audit:
    name: audit
    if: always()
    needs: [syntax, guards, observability, captions]
    runs-on: ubuntu-latest
    steps:
      - name: Require every parallel suite to pass
        run: |
          if [ "${{ needs.syntax.result }}" != "success" ] || [ "${{ needs.guards.result }}" != "success" ] || [ "${{ needs.observability.result }}" != "success" ] || [ "${{ needs.captions.result }}" != "success" ]; then
            echo "One or more audit suites did not pass."
            exit 1
          fi
          echo "All parallel audit suites passed."
