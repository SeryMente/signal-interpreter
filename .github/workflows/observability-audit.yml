name: signal-observability-audit

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check extension/background.js
          node --check extension/auth-bootstrap.js
          node --check extension/auth-signin-assist.js
          node --check tools/cloud-login-bootstrap-test.mjs
          node --check extension/content.js
          node --check extension/mic-guard-main.js
          node --check extension/global-mouse-gesture.js
          node --check extension/hotkey-fallback.js
          node --check tools/global-microphone-hotkey-test.mjs
          node --check tools/microphone-feedback-test.mjs
          node --check extension/platform-screenshot.js
          node --check tools/observability-relay/api/screenshot.js
          node --check extension/offscreen.js
          node --check tools/hotload-active-call-test.mjs
          node --check extension/groq-transcriber.js
          node --check extension/live-caption-core.js
          node --check extension/live-caption-bridge.js
          node --check extension/live-caption-overlay.js
          node --check extension/ui/popup.js
          node --check extension/observability-relay.js
          node --check tools/observability-relay/api/batch.js
          node --check extension/observation-sync.js
          node --check tools/observability/platform-learning.mjs
          node --check tools/observability/platform-learning-test.mjs
          node --check tools/observability-github-pipeline.mjs
          node --check tools/observability-github-pipeline-test.mjs
          node --check tools/observability-package-audit.mjs
          node --check tools/observability-package-audit-test.mjs
          node --check tools/observability-cycle-delta.mjs
          node --check tools/observability-cycle-delta-test.mjs
      - name: Platform learning unit test
        run: node tools/observability/platform-learning-test.mjs
      - name: Screenshot relay unit test
        run: node tools/observability-screenshot-relay-test.mjs
      - name: Cloud login bootstrap unit test
        run: node tools/cloud-login-bootstrap-test.mjs
      - name: Hotload during active call unit test
        run: node tools/hotload-active-call-test.mjs
      - name: Microphone guard unit test
        run: node tools/microphone-guard-test.mjs
      - name: Global mouse mute unit test
        run: node tools/global-mouse-gesture-test.mjs
      - name: Global microphone hotkey unit test
        run: node tools/global-microphone-hotkey-test.mjs
      - name: Microphone feedback unit test
        run: node tools/microphone-feedback-test.mjs
      - name: Platform screenshot unit test
        run: node tools/platform-screenshot-test.mjs
      - name: GitHub package pipeline unit test
        run: node tools/observability-github-pipeline-test.mjs
      - name: Observability package audit unit test
        run: node tools/observability-package-audit-test.mjs
      - name: Observability package baseline audit
        run: node tools/observability-package-audit.mjs observations
      - name: Observability cycle delta unit test
        run: node tools/observability-cycle-delta-test.mjs
      - name: Live Caption core unit test
        run: node tools/live-caption-core-test.mjs
      - name: Live Caption static audit
        run: node tools/live-caption-static-audit.mjs
      - name: Observability static audit
        run: node tools/observability-static-audit.mjs
