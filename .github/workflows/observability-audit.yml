name: signal-observability-audit

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/offscreen.js
          node --check extension/groq-transcriber.js
          node --check extension/ui/popup.js
          node --check extension/github-observability.js
          node --check extension/observation-sync.js
          node --check tools/observability/platform-learning.mjs
          node --check tools/observability/platform-learning-test.mjs
          node --check tools/observability-github-pipeline.mjs
          node --check tools/observability-github-pipeline-test.mjs
          node --check tools/observability-package-audit.mjs
          node --check tools/observability-package-audit-test.mjs
          node --check tools/observability-cycle-delta.mjs
          node --check tools/observability-cycle-delta-test.mjs
      - name: Platform learning unit test
        run: node tools/observability/platform-learning-test.mjs
      - name: GitHub package pipeline unit test
        run: node tools/observability-github-pipeline-test.mjs
      - name: Observability package audit unit test
        run: node tools/observability-package-audit-test.mjs
      - name: Observability package baseline audit
        run: node tools/observability-package-audit.mjs observations
      - name: Observability cycle delta unit test
        run: node tools/observability-cycle-delta-test.mjs
      - name: Observability static audit
        run: node tools/observability-static-audit.mjs
