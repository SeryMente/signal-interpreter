name: signal-observability-freshness
on:
  push:
    branches:
      - main
    paths:
      - "observations/health/github-build.json"
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit live relay receipt and processing freshness
        run: node tools/observability-freshness-audit.mjs observations/health/github-build.json
