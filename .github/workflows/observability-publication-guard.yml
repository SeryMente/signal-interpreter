name: observability-publication-guard

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    if: startsWith(github.event.head_commit.message, 'diagnostic:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify published observation mirror
        shell: bash
        run: |
          test -s observations/latest/latest.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('observations/latest/latest.json','utf8'));if(!x.batchId||!Array.isArray(x.events))process.exit(1);console.log('OBSERVATION_GUARD_PASS',x.batchId,x.events.length)"
      - name: Verify reporter syntax
        run: node --check tools/observation-reporter/server.mjs
